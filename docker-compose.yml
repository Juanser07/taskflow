# TaskFlow - 3 contenedores comunicados por 2 redes de Docker
#
#   navegador ──:8080──▶ web (Nginx) ──frontend-net──▶ api (FastAPI) ──backend-net──▶ db (PostgreSQL)
#
# "web" no puede ver a "db": no comparten red. Solo "api" está en ambas.
name: taskflow

services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # los datos sobreviven a "docker compose down"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    image: taskflow-api:1.0
    container_name: taskflow-api
    environment:
      # "db" es el nombre del servicio de arriba: Docker lo resuelve a la IP del contenedor
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-120}
      SEED_DATA: ${SEED_DATA:-true}
    depends_on:
      db:
        condition: service_healthy           # no arranca hasta que PostgreSQL acepte conexiones
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  web:
    build: ./web
    image: taskflow-web:1.0
    container_name: taskflow-web
    ports:
      - "${WEB_PORT:-8080}:80"               # único puerto expuesto al equipo anfitrión
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend-net
    restart: unless-stopped

networks:
  frontend-net:
    name: taskflow-frontend-net
  backend-net:
    name: taskflow-backend-net
    internal: true                           # red privada: sin salida a internet ni puertos publicados

volumes:
  pgdata:
    name: taskflow-pgdata
